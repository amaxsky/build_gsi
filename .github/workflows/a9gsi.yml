name: Build official AOSP GSI (arm64)

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout stub repo
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
        python-is-python3 openjdk-11-jdk \
        ccache

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Init AOSP manifest (Android 9.0.0_r61)
      run: |
        mkdir -p ~/aosp9
        cd ~/aosp9
        repo init -u https://android.googlesource.com/platform/manifest -b android-9.0.0_r61

    - name: Sync AOSP source
      run: |
        cd ~/aosp9
        repo sync -c --force-sync --no-tags --no-clone-bundle -j$(nproc)

    - name: Setup build env
      run: |
        cd ~/aosp9
        source build/envsetup.sh
        export USE_CCACHE=1
        ccache -M 20G

    - name: Lunch official GSI target (aosp_arm64-userdebug)
      run: |
        cd ~/aosp9
        source build/envsetup.sh
        lunch aosp_arm64-userdebug

    - name: Build systemimage (GSI)
      run: |
        cd ~/aosp9
        make systemimage -j$(nproc)

    - name: Upload system.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: aosp-arm64-gsi-system-img
        path: ~/aosp9/out/target/product/generic_arm64/system.img
