name: Build AOSP 9 r61 GSI (arm64-ab)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout empty repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y \
       git-core gnupg flex bison build-essential zip curl \
       zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
       lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
       python-is-python3

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize AOSP 9 manifest
      run: |
        mkdir -p ~/aosp9
        cd ~/aosp9
        repo init -u https://android.googlesource.com/platform/manifest -b android-9.0.0_r61

    - name: Sync AOSP source
      run: |
        cd ~/aosp9
        repo sync -c --force-sync --no-tags --no-clone-bundle -j$(nproc)

    - name: Clone phh treble_experimentations
      run: |
        cd ~/aosp9/device
        mkdir -p phh
        cd phh
        git clone --depth=1 https://github.com/phhusson/treble_experimentations.git treble
        ls -R treble
        
    - name: Generate GSI device config
      run: |
        cd ~/aosp9/device/phh/treble
        bash generate.sh aosp

    - name: Setup build environment
      run: |
        cd ~/aosp9
        source build/envsetup.sh
        export USE_CCACHE=1
        ccache -M 20G

    - name: Lunch target
      run: |
        cd ~/aosp9
        source build/envsetup.sh
        lunch aosp_arm64_ab-userdebug

    - name: Build systemimage
      run: |
        cd ~/aosp9
        make systemimage -j$(nproc)

    - name: Upload system.img
      uses: actions/upload-artifact@v4
      with:
        name: system-img
        path: ~/aosp9/out/target/product/tdgsi_arm64_ab/system.img
