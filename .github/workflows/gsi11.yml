name: Check Android 11 GSI Build Targets (android11-gsi)

on:
  workflow_dispatch:  # 只允许手动触发

jobs:
  check-targets:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python2 python3 python-is-python3
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "PATH=~/.bin:$PATH" >> $GITHUB_ENV

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Initialize AOSP with android11-gsi branch
      run: |
        mkdir -p ~/aosp
        cd ~/aosp
        repo init -u https://android.googlesource.com/platform/manifest -b android11-gsi --depth=1
        
    - name: Sync required directories
      run: |
        cd ~/aosp
        # 同步所有必需的目录，包括 build 目录
        repo sync -c --no-tags --no-clone-bundle -j$(nproc) \
          platform/build \
          platform/build/soong \
          platform/build/make \
          platform/build/blueprint \
          platform/build/kati \
          platform/device/generic/gsi \
          platform/device/generic/common \
          platform/device/gsi \
          platform/vendor/gsi \
          platform/prebuilts/build-tools \
          platform/system/core \
          platform/frameworks/base \
          platform/external/boringssl \
          platform/external/zlib \
          platform/external/libcxx \
          platform/external/libcxxabi \
          platform/external/compiler-rt \
          platform/bionic \
          platform/art

    - name: Show raw lunch output
      run: |
        cd ~/aosp
        # 确认 build/envsetup.sh 存在
        if [ -f "build/envsetup.sh" ]; then
          echo "✅ build/envsetup.sh found"
          source build/envsetup.sh
          echo ""
          echo "=========================================="
          echo "📋 RAW LUNCH OUTPUT"
          echo "=========================================="
          lunch
        else
          echo "❌ build/envsetup.sh NOT found"
          echo "Current directory contents:"
          ls -la
          echo ""
          echo "Checking build directory:"
          ls -la build/ 2>/dev/null || echo "build directory does not exist"
          exit 1
        fi
