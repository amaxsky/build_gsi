name: Check Android 11 GSI Build Targets (android11-gsi)

on:
  workflow_dispatch:

jobs:
  check-targets:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python2 python3 python-is-python3
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "PATH=~/.bin:$PATH" >> $GITHUB_ENV

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Initialize and sync full AOSP
      run: |
        mkdir -p ~/aosp
        cd ~/aosp
        repo init -u https://android.googlesource.com/platform/manifest -b android11-gsi --depth=1
        # 同步完整仓库
        repo sync -c --no-tags --no-clone-bundle -j$(nproc)

    - name: Show raw lunch output
      run: |
        cd ~/aosp
        source build/envsetup.sh
        echo ""
        echo "=========================================="
        echo "📋 RAW LUNCH OUTPUT"
        echo "=========================================="
        lunch
