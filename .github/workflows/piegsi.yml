name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
    - name: 安装依赖包
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python python3 openjdk-8-jdk ca-certificates procps
        apt-get clean
        rm -rf /var/lib/apt/lists/*

    - name: 安装 repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        chmod +x /usr/local/bin/repo

    - name: 初始化 Repo
      run: |
        export HOME=/root
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 180
      run: |
        export HOME=/root
        repo sync -c -j4 --no-tags --no-clone-bundle
        rm -rf .repo/project-objects .repo/projects 2>/dev/null || true
        df -h

    - name: 构建 GSI (带资源监控)
      shell: bash
      timeout-minutes: 360
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        
        # 资源监控后台进程
        while true; do
          echo "=== $(date '+%H:%M:%S') ==="
          echo "磁盘:"
          df -h /__w | grep -v Filesystem
          df -h / | grep -v Filesystem
          echo "内存:"
          free -h | grep -v Swap
          echo "CPU:"
          top -bn1 | grep "Cpu(s)" | head -1
          echo "负载: $(uptime | awk -F'load average:' '{print $2}')"
          echo "out 目录大小: $(du -sh out 2>/dev/null | cut -f1)"
          echo ".repo 大小: $(du -sh .repo 2>/dev/null | cut -f1)"
          echo ""
          sleep 120
        done &
        MONITOR=$!
        
        # 温和清理：只删 .a
        while true; do
          sleep 300
          find out/soong/.intermediates -name "*.a" -mmin +5 -delete 2>/dev/null
          find out/target/product/generic_arm64/obj/STATIC_LIBRARIES -name "*.a" -mmin +5 -delete 2>/dev/null
          find out/host/linux-x86/obj/STATIC_LIBRARIES -name "*.a" -mmin +5 -delete 2>/dev/null
        done &
        CLEANER=$!
        
        make -j$(nproc) systemimage
        
        kill $MONITOR $CLEANER 2>/dev/null
        df -h

    - name: 上传 system.img
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
