name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
    - name: 清理宿主机空间
      run: |
        df -h /__w
        rm -rf /__w/_temp/* /__w/_actions/* 2>/dev/null || true
        rm -rf /__t/* 2>/dev/null || true
        df -h /__w

    - name: 安装依赖包
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python python3 openjdk-8-jdk ca-certificates
        apt-get clean
        rm -rf /var/lib/apt/lists/*

    - name: 安装 repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        chmod +x /usr/local/bin/repo

    - name: 初始化 Repo
      run: |
        export HOME=/root
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 120
      run: |
        export HOME=/root
        repo sync -c -j4 --no-tags --no-clone-bundle
        # 清理 .repo 缓存释放空间
        rm -rf .repo/project-objects .repo/projects 2>/dev/null || true
        df -h /__w

    - name: 构建 GSI
      shell: bash
      timeout-minutes: 240
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j2 systemimage 2>&1 | while read line; do
          echo "$line"
        done
        df -h /__w

    - name: 检查产物
      if: always()
      run: |
        find out/target/product -name "system.img" -type f
        df -h /__w

    - name: 上传 system.img
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
