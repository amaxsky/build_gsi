name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    
    steps:
    - name: 清理磁盘空间
      run: |
        df -h
        rm -rf /__t /__w/_temp /__w/_actions 2>/dev/null || true
        df -h

    - name: 安装依赖包
      run: |
        apt-get update
        apt-get install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python python3 openjdk-8-jdk

    - name: 安装 repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        chmod +x /usr/local/bin/repo

    - name: 初始化 Repo (pie-gsi 分支)
      run: |
        export HOME=/root
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码（精简）
      timeout-minutes: 120
      run: |
        export HOME=/root
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle
        df -h

    - name: 构建 GSI (仅 system.img)
      shell: bash
      timeout-minutes: 240
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j$(nproc) systemimage

    - name: 上传 system.img
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
