name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    
    steps:
    - name: 安装依赖包
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses6 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python3 openjdk-8-jdk repo \
          libtinfo5 libncurses5
        # 安装 Python 2
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 初始化 Repo (pie-gsi 分支)
      run: |
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 120
      run: repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: 构建 GSI (仅 system.img)
      shell: bash
      timeout-minutes: 240
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j$(nproc) systemimage

    - name: 上传 system.img
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
