name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  LC_ALL: C
  LANG: C

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    
    steps:
    - name: 清理空间
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h

    - name: 安装依赖包
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses6 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python3 openjdk-8-jdk repo \
          libtinfo5 libncurses5
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 初始化 Repo
      run: |
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 120
      run: |
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle
        df -h

    - name: 构建 GSI
      shell: bash
      timeout-minutes: 240
      run: |
        # 关键：预编译 flex 需要完全干净的 C locale，不能有任何 UTF-8
        export LC_ALL=C
        export LANG=C
        export LANGUAGE=C
        unset LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT LC_IDENTIFICATION LC_ALL LANG LANGUAGE
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j$(nproc) systemimage
        df -h

    - name: 上传 system.img
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
