name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
    - name: 安装依赖包
      run: |
        export DEBIAN_FRONTEND=noninteractive
        export TZ=Etc/UTC
        ln -fs /usr/share/zoneinfo/$TZ /etc/localtime
        apt-get update
        apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python python3 openjdk-8-jdk ca-certificates
        apt-get clean
        rm -rf /var/lib/apt/lists/*

    - name: 安装 repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        chmod +x /usr/local/bin/repo

    - name: 初始化 Repo
      run: |
        export HOME=/root
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 180
      run: |
        export HOME=/root
        repo sync -c -j4 --no-tags --no-clone-bundle
        rm -rf .repo/project-objects .repo/projects 2>/dev/null || true

    - name: 删除不参与编译的模块
      run: |
        rm -rf cts/ test/ toolchain/ pdk/ sdk/ development/
        rm -rf platform_testing/ packages/apps/Music* packages/apps/QuickSearchBox
        rm -rf external/libcxxabi external/compiler-rt external/googletest
        df -h

    - name: 构建 GSI
      timeout-minutes: 360
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j$(nproc) systemimage
        df -h

    - name: 上传 system.img
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
