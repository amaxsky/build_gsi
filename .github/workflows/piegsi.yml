name: Build Android 9 GSI

on:
  workflow_dispatch:

env:
  AOSP_BRANCH: 'pie-gsi'
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build:
    name: Build Android 9 GSI
    runs-on: ubuntu-22.04
    
    steps:
    - name: 清理空间
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h

    - name: 安装依赖包
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses6 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python3 openjdk-8-jdk repo \
          libtinfo5 libncurses5
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 初始化 Repo
      run: |
        repo init --depth=1 \
          -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }}

    - name: 同步源代码
      timeout-minutes: 120
      run: |
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle
        df -h

    - name: 替换预编译 flex 并修复 FlexLexer.h
      run: |
        # 用系统 flex 替换
        mv prebuilts/misc/linux-x86/flex/flex-2.5.39 prebuilts/misc/linux-x86/flex/flex-2.5.39.bak
        ln -sf /usr/bin/flex prebuilts/misc/linux-x86/flex/flex-2.5.39
        # 修复 FlexLexer.h：系统 flex 用指针，AOSP 老版本用引用
        # 改 switch_streams 参数类型
        sed -i 's/virtual void switch_streams(FLEX_STD istream\* new_in, FLEX_STD ostream\* new_out = 0)/virtual void switch_streams(FLEX_STD istream\& new_in, FLEX_STD ostream\& new_out)/' frameworks/compile/mclinker/include/mcld/Script/FlexLexer.h
        sed -i 's/FLEX_STD istream\* yyin/FLEX_STD istream\* yyin = 0/' frameworks/compile/mclinker/include/mcld/Script/FlexLexer.h
        sed -i 's/FLEX_STD ostream\* yyout/FLEX_STD ostream\* yyout = 0/' frameworks/compile/mclinker/include/mcld/Script/FlexLexer.h

    - name: 构建 GSI
      shell: bash
      timeout-minutes: 240
      run: |
        source build/envsetup.sh
        lunch aosp_arm64-eng
        make -j$(nproc) systemimage
        df -h

    - name: 上传 system.img
      uses: actions/upload-artifact@v4
      with:
        name: android-9-gsi
        path: out/target/product/generic*/system.img
        retention-days: 30
