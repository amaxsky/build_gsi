name: Build Android 10 GSI (system.img)

on:
  workflow_dispatch:  # 只允许手动触发
    inputs:
      arch:
        description: '选择目标架构'
        required: true
        type: choice
        options:
          - arm64
          - x86_64
          - arm
          - x86
        default: 'arm64'
      variant:
        description: '选择构建变体'
        required: true
        type: choice
        options:
          - userdebug
          - user
          - eng
        default: 'userdebug'

env:
  BRANCH_NAME: android10-gsi
  MANIFEST_URL: https://android.googlesource.com/platform/manifest

jobs:
  build:
    name: Build system.img (${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }})
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup build environment for Android 10
      run: |
        # 对于 Ubuntu 22.04，需要启用 32 位架构
        sudo dpkg --add-architecture i386
        sudo apt-get update
        
        # 安装可用的依赖
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32z1-dev \
          x11proto-core-dev libx11-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip \
          fontconfig python3 python3-pip \
          libssl-dev bc dosfstools mtools \
          rsync cpio schedtool openjdk-11-jdk || true
        
        # 尝试安装 ncurses 相关库（不同 Ubuntu 版本包名不同）
        sudo apt-get install -y libncurses5 2>/dev/null || \
        sudo apt-get install -y libncurses6 2>/dev/null || true
        
        sudo apt-get install -y libncurses-dev 2>/dev/null || true
        sudo apt-get install -y lib32ncurses-dev 2>/dev/null || true
        
        # 创建 python 软链接
        if ! command -v python &> /dev/null; then
          sudo ln -s /usr/bin/python3 /usr/bin/python
        fi
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 下载和安装 repo 工具
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        # 验证 repo 是否可用
        ~/bin/repo --version || echo "Repo installation check"
        
        # 显示系统信息
        echo "========================================="
        echo "System information:"
        echo "========================================="
        cat /etc/os-release | head -5
        uname -a
        java -version 2>&1 || echo "Java not found"
        python3 --version
        free -h
        df -h

    - name: Setup swap
      run: |
        # 创建 swap 文件
        sudo fallocate -l 16G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "Swap setup complete"
        free -h

    - name: Show build configuration
      run: |
        echo "========================================="
        echo "Build Configuration:"
        echo "Architecture: ${{ github.event.inputs.arch }}"
        echo "Variant: ${{ github.event.inputs.variant }}"
        echo "Branch: ${{ env.BRANCH_NAME }}"
        echo "========================================="
        
        case "${{ github.event.inputs.arch }}" in
          arm64)
            TARGET="aosp_arm64"
            ;;
          x86_64)
            TARGET="aosp_x86_64"
            ;;
          arm)
            TARGET="aosp_arm"
            ;;
          x86)
            TARGET="aosp_x86"
            ;;
        esac
        
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "Lunch target: ${TARGET}-${{ github.event.inputs.variant }}"

    - name: Initialize and sync repo
      timeout-minutes: 120
      run: |
        echo "Creating android-gsi directory..."
        mkdir -p android-gsi
        cd android-gsi
        
        echo "Current directory: $(pwd)"
        echo "Initializing repo..."
        
        # 初始化 repo，如果失败则重试
        if ! repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1; then
          echo "First attempt failed, retrying..."
          sleep 10
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1
        fi
        
        echo "Repo initialized at $(date)"
        echo "Starting repo sync..."
        
        # 同步代码
        if ! repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync; then
          echo "Sync failed, retrying once..."
          sleep 10
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync
        fi
        
        echo "Repo sync completed at $(date)"
        
        # 验证关键文件存在
        echo "========================================="
        echo "Verifying repository structure:"
        echo "========================================="
        if [ -f "build/envsetup.sh" ]; then
          echo "✓ build/envsetup.sh found"
        else
          echo "✗ build/envsetup.sh NOT found!"
          echo "Current directory contents:"
          ls -la
          echo "Build directory:"
          ls -la build/ 2>/dev/null || echo "build/ directory not found"
          exit 1
        fi
        
        df -h
        echo "Repository size:"
        du -sh . 2>/dev/null || echo "Cannot calculate size"

    - name: List available lunch targets
      run: |
        cd android-gsi
        if [ ! -f "build/envsetup.sh" ]; then
          echo "Error: build/envsetup.sh not found!"
          exit 1
        fi
        
        source build/envsetup.sh
        echo "========================================="
        echo "Available lunch targets:"
        echo "========================================="
        lunch 2>&1 | head -50 || true
        echo "========================================="
        echo "GSI-related targets:"
        echo "========================================="
        lunch 2>&1 | grep -iE "(gsi|generic|aosp)" | head -20 || true

    - name: Apply Android 10 fixes for Ubuntu 22.04
      run: |
        cd android-gsi
        
        echo "Applying compatibility fixes..."
        
        # 设置环境变量
        export LC_ALL=C
        
        # 修复 Python 引用
        if [ -f "build/soong/scripts/jar-wrapper.sh" ]; then
          echo "Fixing Python references in jar-wrapper.sh"
          sed -i 's/python /python3 /g' build/soong/scripts/jar-wrapper.sh 2>/dev/null || true
        fi
        
        # 修复 JDK 版本检测
        if [ -f "build/make/core/config.mk" ]; then
          echo "Setting JDK 11 compatibility"
          echo "EXPERIMENTAL_USE_OPENJDK11 := true" >> build/make/core/config.mk
        fi
        
        # 修复可能的编译脚本 Python 版本问题
        find . -name "*.py" -type f -exec sed -i 's/#!/usr/bin/env python$/&3/' {} \; 2>/dev/null || true
        
        echo "Compatibility fixes applied"

    - name: Build system.img
      timeout-minutes: 360
      run: |
        cd android-gsi
        
        # 验证关键文件
        if [ ! -f "build/envsetup.sh" ]; then
          echo "Error: build/envsetup.sh still not found!"
          echo "Directory contents:"
          ls -la
          exit 1
        fi
        
        # 设置环境变量
        export LC_ALL=C
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        export ANDROID_JAVA_HOME=$JAVA_HOME
        export PYTHONDONTWRITEBYTECODE=1
        
        echo "Java version:"
        java -version 2>&1
        
        echo "Setting up build environment..."
        source build/envsetup.sh
        
        echo "Running lunch..."
        lunch ${{ env.TARGET }}-${{ github.event.inputs.variant }}
        
        echo "========================================="
        echo "Starting system.img build at $(date)"
        echo "========================================="
        
        # 只编译 systemimage
        if make systemimage -j$(nproc) 2>&1 | tee build.log; then
          echo "========================================="
          echo "Build succeeded at $(date)"
          echo "========================================="
        else
          echo "========================================="
          echo "Build failed at $(date)"
          echo "========================================="
          echo "Last 100 lines of build log:"
          tail -100 build.log
          
          # 诊断信息
          echo "========================================="
          echo "Build diagnostics:"
          echo "========================================="
          df -h
          free -h
          
          # 查找可能的错误
          echo "Checking for common errors:"
          grep -i "error" build.log | tail -20 || echo "No errors found in log"
          
          exit 1
        fi

    - name: Find and verify system.img
      run: |
        cd android-gsi
        
        echo "========================================="
        echo "Looking for system.img..."
        echo "========================================="
        
        # 检查编译输出目录
        if [ ! -d "out/target/product" ]; then
          echo "Error: out/target/product directory not found!"
          echo "Out directory contents:"
          ls -la out/ 2>/dev/null || echo "out/ directory not found"
          exit 1
        fi
        
        # 列出所有生成的镜像
        echo "All generated images:"
        find out/target/product -name "*.img" -type f -exec ls -lh {} \; 2>/dev/null || echo "No images found"
        
        # 查找 system.img
        IMG_PATH=$(find out/target/product -name "system.img" -type f | head -1)
        
        if [ -z "$IMG_PATH" ]; then
          echo "========================================="
          echo "Error: system.img not found!"
          echo "========================================="
          echo "Directory structure:"
          find out/target/product -maxdepth 3 -type d 2>/dev/null
          echo "Files in product directory:"
          find out/target/product -type f 2>/dev/null | head -30
          exit 1
        fi
        
        echo "========================================="
        echo "System image found: $IMG_PATH"
        echo "========================================="
        echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
        ls -lh "$IMG_PATH"

    - name: Compress system.img
      run: |
        IMG_PATH="${{ env.IMG_PATH }}"
        
        if [ ! -f "$IMG_PATH" ]; then
          echo "Error: Cannot find system.img at $IMG_PATH"
          exit 1
        fi
        
        echo "Compressing system image..."
        echo "Original size: $(du -h $IMG_PATH | cut -f1)"
        
        # 使用 xz 压缩
        if xz -z -k -9 -T 0 "$IMG_PATH" 2>/dev/null; then
          COMPRESSED="${IMG_PATH}.xz"
        else
          echo "Multi-threaded compression failed, using single thread..."
          xz -z "$IMG_PATH"
          COMPRESSED="${IMG_PATH}.xz"
        fi
        
        if [ -f "$COMPRESSED" ]; then
          echo "Compressed size: $(du -h $COMPRESSED | cut -f1)"
          echo "XZ_PATH=$COMPRESSED" >> $GITHUB_ENV
        else
          echo "Warning: Compression failed, using original file"
          echo "XZ_PATH=$IMG_PATH" >> $GITHUB_ENV
        fi

    - name: Upload system.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: system-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: ${{ env.XZ_PATH }}
        retention-days: 7
        compression-level: 0

    - name: Generate and upload build info
      run: |
        cd android-gsi
        IMG_PATH="${{ env.IMG_PATH }}"
        
        cat > build-info.txt << EOF
        Android 10 GSI Build Information
        ================================
        Architecture: ${{ github.event.inputs.arch }}
        Variant: ${{ github.event.inputs.variant }}
        Branch: ${{ env.BRANCH_NAME }}
        Build Date: $(date -u)
        GitHub Run ID: ${{ github.run_id }}
        Lunch Target: ${{ env.TARGET }}-${{ github.event.inputs.variant }}
        System Image: $(basename $IMG_PATH)
        System Image Size: $(du -h $IMG_PATH 2>/dev/null | cut -f1)
        System Image MD5: $(md5sum $IMG_PATH 2>/dev/null | cut -d' ' -f1)
        EOF
        
        echo "========================================="
        echo "Build Information:"
        echo "========================================="
        cat build-info.txt
        
        echo "BUILD_INFO_PATH=build-info.txt" >> $GITHUB_ENV

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: build-info.txt

    - name: Cleanup
      if: always()
      run: |
        if [ -d "android-gsi/out" ]; then
          echo "Cleaning up build output..."
          rm -rf android-gsi/out/
          echo "Disk space after cleanup:"
          df -h
        fi
