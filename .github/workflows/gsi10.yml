name: Build Android 10 GSI (system.img)

on:
  workflow_dispatch:  # 只允许手动触发
    inputs:
      arch:
        description: '选择目标架构'
        required: true
        type: choice
        options:
          - arm64
          - x86_64
          - arm
          - x86
        default: 'arm64'
      variant:
        description: '选择构建变体'
        required: true
        type: choice
        options:
          - userdebug
          - user
          - eng
        default: 'userdebug'

env:
  BRANCH_NAME: android10-gsi
  MANIFEST_URL: https://android.googlesource.com/platform/manifest

jobs:
  list-targets:
    name: List available lunch targets
    runs-on: ubuntu-22.04
    
    steps:
    - name: Setup build environment
      run: |
        sudo apt-get update
        # 安装基本依赖，跳过不存在的包
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32z1-dev \
          x11proto-core-dev libx11-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip \
          fontconfig python3 python3-pip \
          libssl-dev bc rsync cpio || true
        
        # 对于 Ubuntu 22.04，ncurses 包名可能不同
        sudo apt-get install -y libncurses5 libncurses-dev lib32ncurses-dev 2>/dev/null || \
        sudo apt-get install -y libncurses6 libncurses-dev 2>/dev/null || true
        
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize and sync minimal repo
      run: |
        mkdir -p android-gsi
        cd android-gsi
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1
        repo sync -c -j4 --no-tags --no-clone-bundle build/ device/ 2>/dev/null || true
        
    - name: List lunch targets
      run: |
        cd android-gsi
        source build/envsetup.sh
        echo "========================================="
        echo "Available lunch targets:"
        echo "========================================="
        lunch 2>&1 | head -50 || true
        echo "========================================="
        echo "GSI-related targets:"
        echo "========================================="
        lunch 2>&1 | grep -iE "(gsi|generic|aosp)" | head -20 || true

  build:
    name: Build system.img (${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }})
    runs-on: ubuntu-22.04
    needs: list-targets
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup build environment for Android 10
      run: |
        # 对于 Ubuntu 22.04，需要启用 32 位架构
        sudo dpkg --add-architecture i386
        sudo apt-get update
        
        # 安装可用的依赖
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32z1-dev \
          x11proto-core-dev libx11-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip \
          fontconfig python3 python3-pip \
          libssl-dev bc dosfstools mtools \
          rsync cpio schedtool || true
        
        # 尝试安装 ncurses 相关库
        sudo apt-get install -y libncurses5 2>/dev/null || \
        sudo apt-get install -y libncurses6 2>/dev/null || true
        
        sudo apt-get install -y libncurses-dev 2>/dev/null || true
        sudo apt-get install -y lib32ncurses-dev 2>/dev/null || true
        
        # Ubuntu 22.04 没有 python2，需要创建软链接或设置
        if ! command -v python &> /dev/null; then
          sudo ln -s /usr/bin/python3 /usr/bin/python
        fi
        
        # 设置 Python 2 兼容性（如果编译脚本需要）
        if ! command -v python2 &> /dev/null; then
          echo "python2 not found, creating alias"
          echo 'alias python2=python3' >> ~/.bashrc
        fi
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        # 显示系统信息
        echo "========================================="
        echo "System information:"
        echo "========================================="
        lsb_release -a 2>/dev/null || cat /etc/os-release
        uname -a
        python3 --version
        free -h
        df -h

    - name: Setup swap
      run: |
        # 创建 swap 文件，增加可用内存
        sudo fallocate -l 16G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "Swap setup complete"
        free -h

    - name: Show build configuration
      run: |
        echo "========================================="
        echo "Build Configuration:"
        echo "Architecture: ${{ github.event.inputs.arch }}"
        echo "Variant: ${{ github.event.inputs.variant }}"
        echo "Branch: ${{ env.BRANCH_NAME }}"
        echo "========================================="
        
        case "${{ github.event.inputs.arch }}" in
          arm64)
            TARGET="aosp_arm64"
            ;;
          x86_64)
            TARGET="aosp_x86_64"
            ;;
          arm)
            TARGET="aosp_arm"
            ;;
          x86)
            TARGET="aosp_x86"
            ;;
        esac
        
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "Lunch target: ${TARGET}-${{ github.event.inputs.variant }}"

    - name: Cache repo
      uses: actions/cache@v3
      with:
        path: |
          android-gsi/.repo
          android-gsi/prebuilts
        key: repo-${{ env.BRANCH_NAME }}-v2-${{ github.run_id }}
        restore-keys: |
          repo-${{ env.BRANCH_NAME }}-v2-

    - name: Initialize repo
      run: |
        mkdir -p android-gsi
        cd android-gsi
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1
        echo "Repo initialized at $(date)"

    - name: Sync repo
      timeout-minutes: 120
      run: |
        cd android-gsi
        echo "Starting repo sync at $(date)"
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync --fail-fast
        echo "Repo sync completed at $(date)"
        df -h
        echo "Disk usage:"
        du -sh android-gsi/

    - name: Apply Android 10 fixes for Ubuntu 22.04
      run: |
        cd android-gsi
        
        # 设置环境变量以兼容新版本工具链
        export LC_ALL=C
        export PYTHONDONTWRITEBYTECODE=1
        
        # 如果 build/soong 使用 python2，需要修改
        if [ -f "build/soong/scripts/jar-wrapper.sh" ]; then
          sed -i 's/python/python3/g' build/soong/scripts/jar-wrapper.sh 2>/dev/null || true
        fi
        
        # 处理可能的 OpenJDK 版本问题
        if [ -f "build/make/core/config.mk" ]; then
          # 移除对特定 JDK 版本的严格要求
          sed -i 's/EXPERIMENTAL_USE_OPENJDK11/EXPERIMENTAL_USE_OPENJDK11 := true/g' build/make/core/config.mk 2>/dev/null || true
        fi
        
        echo "Applied compatibility fixes"

    - name: Build system.img
      timeout-minutes: 360
      run: |
        cd android-gsi
        
        # 设置环境变量
        export LC_ALL=C
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        export ANDROID_JAVA_HOME=$JAVA_HOME
        
        source build/envsetup.sh
        lunch ${{ env.TARGET }}-${{ github.event.inputs.variant }}
        
        echo "Starting build at $(date)"
        echo "Build type: systemimage only"
        
        # 只编译 systemimage
        if make systemimage -j$(nproc) 2>&1 | tee build.log; then
          echo "========================================="
          echo "Build succeeded at $(date)"
          echo "========================================="
        else
          echo "========================================="
          echo "Build failed at $(date)"
          echo "========================================="
          echo "Last 100 lines of build log:"
          tail -100 build.log
          
          # 检查常见问题
          echo "========================================="
          echo "Checking for common issues:"
          echo "========================================="
          
          # 检查 JDK 版本
          java -version 2>&1 || echo "Java not found"
          
          # 检查 Python 版本
          python3 --version
          
          # 检查磁盘空间
          df -h
          
          exit 1
        fi

    - name: Find and verify system.img
      run: |
        cd android-gsi
        echo "Looking for system.img..."
        
        # 查找生成的镜像文件
        find out/target/product -name "*.img" -type f -exec ls -lh {} \;
        
        IMG_PATH=$(find out/target/product -name "system.img" -type f | head -1)
        if [ -z "$IMG_PATH" ]; then
          echo "========================================="
          echo "Error: system.img not found!"
          echo "========================================="
          echo "Contents of out directory:"
          find out/target/product -type f 2>/dev/null | head -30
          echo "Directory structure:"
          find out/target/product -maxdepth 2 -type d 2>/dev/null
          exit 1
        fi
        
        echo "========================================="
        echo "System image found: $IMG_PATH"
        echo "========================================="
        echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
        ls -lh "$IMG_PATH"

    - name: Compress system.img
      run: |
        IMG_PATH="${{ env.IMG_PATH }}"
        echo "Compressing system image..."
        echo "Original: $(ls -lh $IMG_PATH | awk '{print $5}')"
        
        # 使用 xz 压缩
        xz -z -k -9 -T 0 "$IMG_PATH" 2>/dev/null || xz -z "$IMG_PATH"
        
        if [ -f "${IMG_PATH}.xz" ]; then
          echo "Compressed: $(ls -lh ${IMG_PATH}.xz | awk '{print $5}')"
          echo "XZ_PATH=${IMG_PATH}.xz" >> $GITHUB_ENV
        else
          echo "Compression failed, using original file"
          echo "XZ_PATH=$IMG_PATH" >> $GITHUB_ENV
        fi

    - name: Upload system.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: system-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: ${{ env.XZ_PATH }}
        retention-days: 7
        compression-level: 0  # 已经压缩过了

    - name: Generate build info
      run: |
        cd android-gsi
        IMG_PATH="${{ env.IMG_PATH }}"
        
        cat > build-info.txt << EOF
        Android 10 GSI Build Information
        ================================
        Architecture: ${{ github.event.inputs.arch }}
        Variant: ${{ github.event.inputs.variant }}
        Branch: ${{ env.BRANCH_NAME }}
        Build Date: $(date -u)
        GitHub Run ID: ${{ github.run_id }}
        Lunch Target: ${{ env.TARGET }}-${{ github.event.inputs.variant }}
        System Image: $(basename $IMG_PATH)
        System Image Size: $(du -h $IMG_PATH | cut -f1)
        System Image MD5: $(md5sum $IMG_PATH | cut -d' ' -f1)
        EOF
        
        echo "========================================="
        echo "Build Information:"
        echo "========================================="
        cat build-info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: android-gsi/build-info.txt

    - name: Cleanup
      if: always()
      run: |
        if [ -d "android-gsi/out" ]; then
          echo "Cleaning up build output..."
          rm -rf android-gsi/out/
          echo "Disk space after cleanup:"
          df -h
        fi
