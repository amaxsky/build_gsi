name: Build Android 10 GSI (system.img)

on:
  workflow_dispatch:  # 只允许手动触发
    inputs:
      arch:
        description: '选择目标架构'
        required: true
        type: choice
        options:
          - arm64
          - x86_64
          - arm
          - x86
        default: 'arm64'
      variant:
        description: '选择构建变体'
        required: true
        type: choice
        options:
          - eng
          - userdebug
          - user
        default: 'eng'

env:
  BRANCH_NAME: android10-gsi
  MANIFEST_URL: https://android.googlesource.com/platform/manifest

jobs:
  build:
    name: Build system.img (${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }})
    runs-on: ubuntu-22.04
    
    steps:
    - name: Setup build environment
      run: |
        # 启用 32 位架构
        sudo dpkg --add-architecture i386
        sudo apt-get update
        
        # 安装依赖包（包括 Python 2）
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32z1-dev \
          x11proto-core-dev libx11-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip \
          fontconfig python3 python3-pip python2 \
          libssl-dev bc dosfstools mtools \
          rsync cpio schedtool openjdk-11-jdk \
          libncurses5 libncurses-dev lib32ncurses-dev 2>/dev/null || true
        
        # 确保 python 指向 python2（Android 10 需要）
        if [ -f /usr/bin/python2 ]; then
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "Python version:"
          python --version
        else
          echo "Warning: python2 not available"
          # 如果没有 python2，创建兼容脚本
          sudo ln -sf /usr/bin/python3 /usr/bin/python
        fi
        
        # 配置 git
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 安装 repo 工具
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        # 显示系统信息
        echo "=== System Information ==="
        cat /etc/os-release | head -3
        uname -a
        java -version 2>&1 || true
        python --version 2>&1 || true
        python3 --version 2>&1 || true
        free -h
        df -h

    - name: Setup swap
      run: |
        echo "Setting up swap..."
        
        # 关闭并删除已存在的 swap
        sudo swapoff -a 2>/dev/null || true
        
        # 删除旧的 swap 文件
        sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
        
        # 创建新的 swap 文件
        echo "Creating 16GB swap file..."
        sudo fallocate -l 16G /swapfile 2>/dev/null || \
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress 2>/dev/null || \
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
        echo "Swap configured:"
        free -h

    - name: Set target configuration
      run: |
        case "${{ github.event.inputs.arch }}" in
          arm64)
            echo "TARGET=aosp_arm64" >> $GITHUB_ENV
            ;;
          x86_64)
            echo "TARGET=aosp_x86_64" >> $GITHUB_ENV
            ;;
          arm)
            echo "TARGET=aosp_arm" >> $GITHUB_ENV
            ;;
          x86)
            echo "TARGET=aosp_x86" >> $GITHUB_ENV
            ;;
        esac
        
        echo "Build Configuration:"
        echo "  Architecture: ${{ github.event.inputs.arch }}"
        echo "  Variant: ${{ github.event.inputs.variant }}"
        echo "  Target: $TARGET-${{ github.event.inputs.variant }}"
        echo "  Branch: ${{ env.BRANCH_NAME }}"

    - name: Initialize and sync repo
      timeout-minutes: 120
      run: |
        # 清理旧目录
        rm -rf android-gsi
        mkdir -p android-gsi
        cd android-gsi
        
        echo "Initializing Android repository..."
        echo "Branch: ${{ env.BRANCH_NAME }}"
        
        # 初始化 repo
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1 || {
          echo "First attempt failed, retrying in 30 seconds..."
          sleep 30
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH_NAME }} --depth=1
        }
        
        echo "Syncing repository..."
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync || {
          echo "Sync with all cores failed, trying with 4 jobs..."
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync
        }
        
        echo "Repository sync completed"
        
        # 验证关键文件
        if [ ! -f "build/envsetup.sh" ]; then
          echo "ERROR: build/envsetup.sh not found!"
          echo "Current directory: $(pwd)"
          ls -la | head -20
          exit 1
        fi
        
        echo "Repository size: $(du -sh . | cut -f1)"
        df -h .

    - name: List available targets
      run: |
        cd android-gsi
        source build/envsetup.sh
        
        echo "=== Available Lunch Targets ==="
        lunch 2>&1 | head -50 || true

    - name: Fix Python 2/3 compatibility
      run: |
        cd android-gsi
        
        echo "Fixing Python 2/3 compatibility issues..."
        
        # 检查 Python 版本
        PYTHON_VERSION=$(python --version 2>&1)
        echo "Using Python: $PYTHON_VERSION"
        
        # 如果是 Python 3，修复 print 语句
        if echo "$PYTHON_VERSION" | grep -q "Python 3"; then
          echo "Applying Python 3 fixes..."
          
          # 修复 normalize_path.py
          if [ -f "build/make/tools/normalize_path.py" ]; then
            echo "Fixing build/make/tools/normalize_path.py"
            # 将 print 语句转换为 print 函数
            sed -i 's/print \(.*\)/print(\1)/' build/make/tools/normalize_path.py
            # 确保有 from __future__ import print_function
            sed -i '1i from __future__ import print_function' build/make/tools/normalize_path.py
          fi
          
          # 修复其他可能的 Python 2 脚本
          find build/ -name "*.py" -type f | while read file; do
            # 添加 print_function 导入
            if ! grep -q "from __future__ import print_function" "$file" 2>/dev/null; then
              if grep -q "^[[:space:]]*print " "$file" 2>/dev/null; then
                echo "Fixing: $file"
                sed -i '1s/^/from __future__ import print_function\n/' "$file"
                sed -i 's/^\([[:space:]]*\)print \(.*\)/\1print(\2)/' "$file"
              fi
            fi
          done
        else
          echo "Python 2 detected, no fixes needed"
        fi
        
        echo "Python compatibility fixes applied"

    - name: Apply additional Android 10 fixes
      run: |
        cd android-gsi
        
        echo "Applying additional fixes..."
        
        # 设置 JDK 11
        if [ -f "build/make/core/config.mk" ]; then
          if ! grep -q "EXPERIMENTAL_USE_OPENJDK11" build/make/core/config.mk; then
            echo "EXPERIMENTAL_USE_OPENJDK11 := true" >> build/make/core/config.mk
          fi
        fi
        
        # 修复 bytes/str 问题（Python 3）
        find build/ -name "*.py" -type f -exec sed -i 's/\([a-zA-Z_]*\)\.decode("hex")/bytes.fromhex(\1)/g' {} \; 2>/dev/null || true
        
        echo "Additional fixes applied"

    - name: Build system.img
      timeout-minutes: 360
      run: |
        cd android-gsi
        
        # 设置编译环境
        export LC_ALL=C
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        export ANDROID_JAVA_HOME=$JAVA_HOME
        export PYTHONDONTWRITEBYTECODE=1
        
        # 确保使用正确的 Python
        if [ -f /usr/bin/python2 ]; then
          export PATH=/usr/bin:$PATH
          echo "Using Python 2 for build"
        fi
        
        echo "Build Environment:"
        echo "  Java: $(java -version 2>&1 | head -1)"
        echo "  Python: $(python --version 2>&1)"
        echo "  Python3: $(python3 --version 2>&1)"
        echo "  Cores: $(nproc)"
        echo "  Target: ${{ env.TARGET }}-${{ github.event.inputs.variant }}"
        
        # 初始化编译环境
        source build/envsetup.sh
        
        # 设置编译目标
        lunch "${{ env.TARGET }}-${{ github.event.inputs.variant }}"
        
        echo "=== Building system.img ==="
        echo "Start time: $(date)"
        
        # 编译 system.img
        make systemimage -j$(nproc) 2>&1 | tee build.log
        
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "Build completed successfully at $(date)"
        else
          echo "Build failed at $(date)"
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log
          echo "=== Checking for errors ==="
          grep -i "error:" build.log | tail -20 || echo "No specific errors found"
          exit 1
        fi

    - name: Locate system.img
      run: |
        cd android-gsi
        
        echo "Searching for system.img..."
        
        # 查找生成的镜像
        SYSTEM_IMG=$(find out/target/product -name "system.img" -type f -print -quit)
        
        if [ -z "$SYSTEM_IMG" ]; then
          echo "ERROR: system.img not found!"
          echo "Output directory structure:"
          find out/target/product -maxdepth 2 -type d 2>/dev/null || echo "No output directory"
          echo "All .img files:"
          find out -name "*.img" -type f 2>/dev/null || echo "No img files found"
          exit 1
        fi
        
        echo "Found system.img: $SYSTEM_IMG"
        ls -lh "$SYSTEM_IMG"
        
        # 保存路径供后续步骤使用
        echo "SYSTEM_IMG_PATH=$SYSTEM_IMG" >> $GITHUB_ENV

    - name: Compress system.img
      run: |
        cd android-gsi
        
        SYSTEM_IMG="${{ env.SYSTEM_IMG_PATH }}"
        
        if [ ! -f "$SYSTEM_IMG" ]; then
          echo "ERROR: System image not found at $SYSTEM_IMG"
          exit 1
        fi
        
        echo "Compressing system.img..."
        echo "Original size: $(du -h "$SYSTEM_IMG" | cut -f1)"
        
        # 压缩
        xz -9 -T0 -k "$SYSTEM_IMG" 2>/dev/null || xz -9 -k "$SYSTEM_IMG"
        
        if [ -f "${SYSTEM_IMG}.xz" ]; then
          echo "Compressed size: $(du -h "${SYSTEM_IMG}.xz" | cut -f1)"
          echo "COMPRESSED_PATH=${SYSTEM_IMG}.xz" >> $GITHUB_ENV
        else
          echo "Compression failed, using original file"
          echo "COMPRESSED_PATH=$SYSTEM_IMG" >> $GITHUB_ENV
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: system-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: android-gsi/${{ env.COMPRESSED_PATH }}
        retention-days: 7
        compression-level: 0

    - name: Generate build info
      run: |
        cd android-gsi
        
        SYSTEM_IMG="${{ env.SYSTEM_IMG_PATH }}"
        BUILD_DATE=$(date -u)
        IMG_SIZE=$(du -h "$SYSTEM_IMG" | cut -f1)
        IMG_MD5=$(md5sum "$SYSTEM_IMG" | cut -d' ' -f1)
        IMG_NAME=$(basename "$SYSTEM_IMG")
        
        echo "Android 10 GSI Build" > build-info.txt
        echo "====================" >> build-info.txt
        echo "Architecture: ${{ github.event.inputs.arch }}" >> build-info.txt
        echo "Variant: ${{ github.event.inputs.variant }}" >> build-info.txt
        echo "Build Target: ${{ env.TARGET }}-${{ github.event.inputs.variant }}" >> build-info.txt
        echo "Branch: ${{ env.BRANCH_NAME }}" >> build-info.txt
        echo "Build Date: $BUILD_DATE" >> build-info.txt
        echo "Image: $IMG_NAME" >> build-info.txt
        echo "Size: $IMG_SIZE" >> build-info.txt
        echo "MD5: $IMG_MD5" >> build-info.txt
        
        echo "=== Build Information ==="
        cat build-info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ github.event.inputs.arch }}-${{ github.event.inputs.variant }}
        path: android-gsi/build-info.txt

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up..."
        
        # 移除 swap
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        
        # 清理构建输出
        if [ -d "android-gsi/out" ]; then
          rm -rf android-gsi/out
        fi
        
        echo "Final disk usage:"
        df -h
